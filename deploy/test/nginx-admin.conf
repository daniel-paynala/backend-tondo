# ═══════════════════════════════════════════════════════════════════════════
#  Backoffice Tonji (Next.js) — environnement de TEST, port 80.
#
#  Next écoute sur 127.0.0.1:3000 et n'est jamais exposé directement : nginx
#  est devant pour les en-têtes, les journaux et le port 80.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/admin-test.access.log;
    error_log  /var/log/nginx/admin-test.error.log;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Nécessaire au rechargement à chaud et aux flux serveur de Next.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
