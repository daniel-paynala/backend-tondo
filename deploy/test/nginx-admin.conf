# ═══════════════════════════════════════════════════════════════════════════
#  Backoffice Tonji (Next.js) — environnement de TEST, port 80.
#
#  Next écoute sur 127.0.0.1:3000 et n'est jamais exposé directement : nginx
#  est devant pour les en-têtes, les journaux et le port 80.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/admin-test.access.log;
    error_log  /var/log/nginx/admin-test.error.log;

    # ── Relais vers le backend, sur ce même port 80 ────────────────────────
    # Le backend écoute sur le 8080, mais ce port reste fermé dans le security
    # group AWS. Or la page de connexion appelle l'API depuis le NAVIGATEUR
    # (NEXT_PUBLIC_API_URL est une variable client) : elle a donc besoin d'un
    # chemin réellement joignable depuis l'extérieur.
    #
    # La barre oblique finale de proxy_pass est ce qui fait tout le travail :
    # elle retire le préfixe /backend/, si bien que /backend/api/health arrive
    # à Laravel comme /api/health, sans que l'application ait à connaître ce
    # préfixe.
    location /backend/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aligné sur le fastcgi_read_timeout du backend : Paynala répond
        # parfois en dizaines de secondes sur un décaissement.
        proxy_read_timeout 180s;

        client_max_body_size 12M;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Nécessaire au rechargement à chaud et aux flux serveur de Next.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
