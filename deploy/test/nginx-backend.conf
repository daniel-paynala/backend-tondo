# ═══════════════════════════════════════════════════════════════════════════
#  Backend Tonji — environnement de TEST, écoute en clair sur le port 8080.
#
#  Port 8080 et non 80 : le 80 sert le backoffice, celui qu'un humain ouvre
#  dans un navigateur. Tant qu'il n'y a pas de DNS, on distingue les deux
#  services par le port, pas par le nom d'hôte.
#
#  Pas de TLS : un certificat ne se délivre pas pour une adresse IP nue. Les
#  échanges de cet environnement passent donc en clair — acceptable pour du
#  test contre le bac à sable Paynala, à ne jamais reproduire en production.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /var/www/Backend/public;
    index index.php;

    charset utf-8;

    # Un environnement de test joignable par IP n'a rien à faire dans un index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Pièces jointes des demandes de plafond association.
    client_max_body_size 12M;

    access_log /var/log/nginx/backend-test.access.log;
    error_log  /var/log/nginx/backend-test.error.log;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php-fpm/tonji.sock;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Paynala répond parfois en dizaines de secondes sur un décaissement ;
        # les 60 s par défaut couperaient la requête avant sa réponse et nous
        # laisseraient avec une issue INCONNUE à réconcilier pour rien.
        fastcgi_read_timeout 180s;
    }

    # Tout fichier caché reste inaccessible, sauf .well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
