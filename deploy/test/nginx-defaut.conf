# ═══════════════════════════════════════════════════════════════════════════
#  Requêtes adressées à l'IP nue, ou à un nom inconnu : aucune réponse.
#
#  L'environnement de test ne se sert que par test-api.tonji.ga et
#  test-controller.tonji.ga, derrière Cloudflare. Tout le reste vient de
#  scanners qui balaient l'IPv4 en permanence — en six jours, dix-sept
#  adresses inconnues sur dix-neuf (zgrab, Palo Alto, InternetMeasurement…).
#
#  444 est un code propre à nginx : la connexion est fermée sans le moindre
#  octet de réponse. Pas de page d'erreur, pas d'en-tête Server, rien qui
#  confirme qu'un service tourne ici.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Journal séparé : il mesure le bruit de fond sans polluer les journaux
    # des deux services réels.
    access_log /var/log/nginx/ip-nue.access.log;

    return 444;
}
