# ═══════════════════════════════════════════════════════════════════════════
#  Environnement de TEST servi par noms de domaine, derrière Cloudflare.
#
#    test-api.tonji.ga         → backend Laravel
#    test-controller.tonji.ga  → backoffice Next
#
#  Cloudflare termine le TLS (zone en mode Flexible, comme la prod) et parle
#  à l'origine en HTTP sur le port 80. Le visiteur voit du HTTPS ; le tronçon
#  Cloudflare → instance reste en clair.
#
#  Ces blocs ne sont PAS default_server : une requête adressée à l'IP nue
#  continue d'aboutir aux blocs historiques tant qu'on ne les a pas retirés.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen      80;
    listen      [::]:80;
    server_name test-api.tonji.ga;

    # HTTPS obligatoire. Cloudflare parle en HTTP à l'origine et transmet le
    # schéma réellement utilisé par l'appelant dans X-Forwarded-Proto.
    #
    # REFUS plutôt que redirection : une redirection laisserait l'intégration
    # fonctionner en envoyant d'abord la clé partenaire et le PIN en clair.
    # Un refus la fait échouer dès le premier essai, là où on la corrige.
    if ($http_x_forwarded_proto = "http") {
        rewrite ^ /__https_obligatoire last;
    }
    location = /__https_obligatoire {
        internal;
        default_type application/json;
        return 403 '{"message":"HTTPS obligatoire. Utilisez https://test-api.tonji.ga.","code":"https_obligatoire"}';
    }

    root  /var/www/Backend/public;
    index index.php;
    charset utf-8;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 12M;

    access_log /var/log/nginx/test-api.access.log;
    error_log  /var/log/nginx/test-api.error.log;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php-fpm/tonji.sock;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Paynala répond parfois en dizaines de secondes sur un décaissement.
        fastcgi_read_timeout 180s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen      80;
    listen      [::]:80;
    server_name test-controller.tonji.ga;

    # Un navigateur arrivé en HTTP est simplement renvoyé vers HTTPS : le
    # cookie de session est marqué Secure et ne circulerait pas autrement.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/test-controller.access.log;
    error_log  /var/log/nginx/test-controller.error.log;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare parle en HTTP à l'origine : on transmet le schéma que le
        # visiteur a réellement utilisé, pas celui du dernier tronçon.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
